
---

- name: "Reload NFS exports"
  ansible.builtin.command:
    cmd: "exportfs -ra"
  become: true

- name: "Restart NFS server"
  ansible.builtin.service:
    name: "nfs-kernel-server"
    state: restarted
  become: true

- name: "Reboot server"
  ansible.builtin.reboot:
    msg: "Reboot required to apply lockd port configuration"
    reboot_timeout: 600