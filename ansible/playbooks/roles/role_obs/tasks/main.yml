# grafana/provisioning/datasources/datasource.yaml
- name: "Copy grafana datasource file"
  ansible.builtin.template:
    src: "datasource.yaml.jinja"
    dest: "{{ grafana_provisioning_datasources_path }}/datasource.yaml"
    owner: "{{ global_remote_user }}"
    group: "{{ global_remote_user }}"
    mode: "0644"

# grafana/provisioning/dashboards/dashboard.yaml
- name: "Copy grafana datasource file"
  ansible.builtin.template:
    src: "dashboard.yaml.jinja"
    dest: "{{ grafana_provisioning_dashboards_path }}/dashboard.yaml"
    owner: "{{ global_remote_user }}"
    group: "{{ global_remote_user }}"
    mode: "0644"

# grafana/dashboards/1860.json
- name: "Copy grafana dashboard 1860 file"
  ansible.builtin.copy:
    src: "1860.json"
    dest: "{{ grafana_dashboards_path }}/1860.json"
    owner: "{{ global_remote_user }}"
    group: "{{ global_remote_user }}"
    mode: "0644"

- name: "Stop and remove containers"
  community.docker.docker_compose_v2:
    project_src: "{{ obs_path }}"
    state: absent

- name: "Start containers"
  community.docker.docker_compose_v2:
    project_src: "{{ obs_path }}"
    state: present
# <-- OBS-server