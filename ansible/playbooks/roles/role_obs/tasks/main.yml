# --> Folders
- name: "Create global folders"
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ global_remote_user }}"
    group: "{{ global_remote_user }}" # same as user
  loop: "{{ obs_local_directories }}"
# <-- Folders

# --> OBS-server
- name: "Copy .env file"
  ansible.builtin.template:
    src: "dotenv.jinja"
    dest: "{{ obs_path }}/.env"
    owner: "{{ global_remote_user }}"
    group: "{{ global_remote_user }}"
    mode: "0600"

- name: "Copy compose file"
  ansible.builtin.template:
    src: "obs.yaml.jinja"
    dest: "{{ obs_path }}/{{ def_compose }}"
    owner: "{{ global_remote_user }}"
    group: "{{ global_remote_user }}"
    mode: "0644"

- name: "Copy mimir config file"
  ansible.builtin.template:
    src: "mimir_config.yaml.jinja"
    dest: "{{ obs_path }}/mimir_config.yaml"
    owner: "{{ global_remote_user }}"
    group: "{{ global_remote_user }}"
    mode: "0644"

# /etc/grafana/grafana.ini
- name: "Copy grafana.ini"
  ansible.builtin.template:
    src: "grafana.ini.jinja"
    dest: "{{ obs_path }}/grafana.ini"
    owner: "{{ global_remote_user }}"
    group: "{{ global_remote_user }}"
    mode: "0644"

