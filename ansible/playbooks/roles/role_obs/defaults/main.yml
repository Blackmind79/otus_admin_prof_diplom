# code: language=yaml

---

obs_path: "/opt/obs"
mimir_path: "{{ obs_path }}/data/mimir"
grafana_path: "{{ obs_path }}/data/grafana"
grafana_provisioning_path: "{{ obs_path }}/data/provisioning"
grafana_provisioning_datasources_path: "{{ grafana_provisioning_path }}/datasources"
grafana_provisioning_dashboards_path: "{{ grafana_provisioning_path }}/dashboards"
grafana_provisioning_alerting_path: "{{ grafana_provisioning_path }}/alerting"
grafana_dashboards_path: "{{ obs_path }}/data/dashboards"
loki_path: "{{ obs_path }}/data/loki"

obs_local_directories:
  - "{{ obs_path }}"
  - "{{ mimir_path }}"
  - "{{ grafana_path }}"
  - "{{ grafana_provisioning_path }}"
  - "{{ grafana_provisioning_datasources_path }}"
  - "{{ grafana_provisioning_dashboards_path }}"
  - "{{ grafana_provisioning_alerting_path }}"
  - "{{ grafana_dashboards_path }}"
  - "{{ loki_path }}"

## --> Images
## Images internal
img_mimir: "{{ docker.insecure_registries.r01.host }}:{{ docker.insecure_registries.r01.port }}/mimir:latest"
img_grafana: "{{ docker.insecure_registries.r01.host }}:{{ docker.insecure_registries.r01.port }}/grafana:latest"
img_loki: "{{ docker.insecure_registries.r01.host }}:{{ docker.insecure_registries.r01.port }}/loki:latest"

## ...or Images Public
# img_mimir: "grafana/mimir:latest"
# img_grafana: "grafana/grafana:latest"
## <-- Images